# Test profile: SQLite like dev, but a throwaway database file (the URL and directories come from IntegrationTestBase),
# seed data on, and every scheduled job off so nothing runs behind a test's back.
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.data-source-properties.foreign_keys=true
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.date_class=TEXT
spring.datasource.hikari.data-source-properties.date_string_format=yyyy-MM-dd'T'HH:mm:ss.SSS
spring.jpa.database-platform=com.scpl.config.SqliteDialect

spring.thymeleaf.cache=false
scpl.seed.enabled=true
scpl.jobs.enabled=false
scpl.public-base-url=http://localhost
scpl.backup.max-per-day=3

feature.dev-log-credentials=false
feature.ai.enabled=false
feature.cross-society.enabled=false

logging.level.root=WARN
logging.level.com.scpl=INFO