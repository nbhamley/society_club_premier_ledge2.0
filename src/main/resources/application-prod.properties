# ---------------------------------------------------------------
# Production profile. Choose ONE database block, supply values via env vars.
# No secret has a default here: the app must fail fast if one is missing.
# ---------------------------------------------------------------

# ---- PostgreSQL (default prod target) ----
spring.datasource.url=${SCPL_DB_URL}
spring.datasource.username=${SCPL_DB_USER}
spring.datasource.password=${SCPL_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# For MySQL instead, use:
#   spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#   spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#   spring.flyway.locations=classpath:db/migration-mysql

# Clear the SQLite-only driver properties inherited from application.properties.
spring.datasource.hikari.maximum-pool-size=20

# Dedicated production baseline (see README "Switching to MySQL/PostgreSQL").
spring.flyway.locations=classpath:db/migration-postgresql

spring.jpa.hibernate.ddl-auto=validate
spring.thymeleaf.cache=true

scpl.public-base-url=${SCPL_PUBLIC_BASE_URL}
scpl.uploads.dir=${SCPL_UPLOADS_DIR:/var/scpl/uploads}
scpl.backup.dir=${SCPL_BACKUP_DIR:/var/scpl/backups}
scpl.backup.society-dir=${SCPL_SOCIETY_BACKUP_DIR:/var/scpl/society-backups}
scpl.backup.master-key=${SCPL_BACKUP_MASTER_KEY}

scpl.seed.enabled=false
feature.dev-log-credentials=false
feature.ai.enabled=${SCPL_AI_ENABLED:false}
ai.endpoint=${SCPL_AI_ENDPOINT:}
feature.cross-society.enabled=${SCPL_CROSS_SOCIETY_ENABLED:false}

server.servlet.session.cookie.secure=true
logging.level.com.scpl=INFO