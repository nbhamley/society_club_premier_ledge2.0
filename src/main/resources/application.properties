spring.application.name=scpl
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=8080


# ---------------------------------------------------------------
# JPA - schema is owned by Flyway; Hibernate only validates.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ---------------------------------------------------------------
# Web / uploads (10 MB hard cap, also re-checked in code with Commons IO)
# ---------------------------------------------------------------
spring.servlet.multipart.enabled=true
# Large enough for society-backup restore and full-dump staging. The 10 MB import limit is enforced in
# ImportService (before any parsing). Put per-path body limits at the reverse proxy.
spring.servlet.multipart.max-file-size=256MB
spring.servlet.multipart.max-request-size=257MB
spring.servlet.multipart.file-size-threshold=1MB
server.error.whitelabel.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.mvc.hiddenmethod.filter.enabled=true

# ---------------------------------------------------------------
# SCPL application settings
# ---------------------------------------------------------------
scpl.public-base-url=http://localhost:8080
scpl.uploads.dir=/var/scpl/uploads
scpl.uploads.max-bytes=10485760
scpl.uploads.allowed-extensions=csv,json,xlsx,zip
scpl.uploads.retention-days-rejected=30

scpl.backup.dir=/var/scpl/backups
scpl.backup.society-dir=/var/scpl/society-backups
# Master key for per-tenant AES-256-GCM key derivation. Override with SCPL_BACKUP_MASTER_KEY.
scpl.backup.master-key=${SCPL_BACKUP_MASTER_KEY:dev-only-master-key-change-me-0123456789}
scpl.backup.retention-days=30
scpl.backup.nightly-cron=0 30 2 * * *
scpl.backup.keep-daily=7
scpl.backup.keep-weekly=4
scpl.backup.keep-monthly=3

scpl.subscription.trial-days=14
scpl.subscription.read-only-after-past-due-days=30
scpl.subscription.dunning-cron=0 0 3 * * *
# Distinct admins who must approve adding a new admin (capped at the admins able to vote).
# Every other approval type needs a single approval.
scpl.approval.admin-invite-required=3
scpl.approval.min-admins-to-activate=3

# ---------------------------------------------------------------
# Feature flags
# ---------------------------------------------------------------
feature.ai.enabled=false
feature.cross-society.enabled=false
feature.dev-log-credentials=false

ai.endpoint=
ai.timeout-seconds=60

logging.level.root=INFO
logging.level.com.scpl=INFO

# Prefix for 10-digit phone numbers when building wa.me links (wa.me needs the country code).
scpl.default-country-code=91
# Dev switch: make the stub payment gateway decline every charge, to exercise the dunning flow.
scpl.payment.stub.always-fail=false


scpl.uploads.max-rows=5000
scpl.uploads.review-days=14
scpl.uploads.max-open-batches=10
# scpl.uploads.retention-days-rejected (30) now also governs failed and processed batches:
# their files, which contain PII, are deleted after that many days.
scpl.backup.max-per-day=3
scpl.backup.max-restore-bytes=268435456
scpl.backup.max-dump-bytes=268435456


# HTML date and datetime-local inputs send ISO text; Spring's default (locale SHORT style) would reject it.
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso
spring.mvc.format.time=iso


# Master switch for every scheduled job. Set to false on all but one node, and in tests.
scpl.jobs.enabled=true
scpl.import.poll-delay-ms=60000
scpl.import.poll-initial-delay-ms=15000
scpl.maintenance.purge-cron=0 30 3 * * *
scpl.notifications.retention-days=90
scpl.backup.mysqldump-path=mysqldump
scpl.backup.pgdump-path=pg_dump
scpl.backup.dump-timeout-minutes=30