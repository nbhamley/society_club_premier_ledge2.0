<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Page not found')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container narrow error-page">
    <p class="error-code" th:text="${status != null} ? ${status} : 404">404</p>
    <h1>We couldn't find that</h1>
    <p th:text="${message != null} ? ${message} : 'We could not find that page.'">Message</p>
    <p><a class="btn" th:href="@{/}">Go to the home page</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
