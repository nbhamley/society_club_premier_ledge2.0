<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access denied')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container narrow error-page">
    <p class="error-code" th:text="${status != null} ? ${status} : 403">403</p>
    <h1>You can't open this page</h1>
    <p th:text="${message != null} ? ${message} : 'You do not have permission to view this page.'">Message</p>
    <p><a class="btn" th:href="@{/login}" th:if="${nav == null}">Sign in</a>
        <a class="btn" th:href="@{/dashboard}" th:if="${nav != null}">Back to my dashboard</a>
        <a class="btn btn-secondary" th:href="@{/}">Home</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
