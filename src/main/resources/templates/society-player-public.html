<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${player.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <p class="muted"><a th:href="@{/society/{s}/players(s=${society.slug})}" th:text="${society.name} + ' / Players'">Players</a></p>

    <section class="player-hero">
        <img class="avatar" th:if="${player.photoUrl}" th:src="@{${player.photoUrl}}" th:alt="${player.name}">
        <div>
            <h1 th:text="${player.name}">Player</h1>
            <p><span class="badge" th:if="${player.role}" th:text="${player.role.label}">Batsman</span>
                <span th:if="${player.teamName}" th:text="${player.teamName}">Team</span>
                <span class="muted" th:if="${player.jerseyNumber}" th:text="'#' + ${player.jerseyNumber}">#7</span></p>
            <p class="muted"><span th:if="${player.battingStyle}" th:text="${player.battingStyle.label}">Right-hand bat</span>
                <span th:if="${player.bowlingStyle != null and player.bowlingStyle.name() != 'NONE'}"
                      th:text="'&middot; ' + ${player.bowlingStyle.label}">Right-arm fast</span></p>
        </div>
    </section>

    <section class="grid grid-3 stats">
        <div class="card stat"><span class="stat-num" th:text="${player.matchesPlayed}">0</span><span>Matches</span></div>
        <div class="card stat"><span class="stat-num" th:text="${player.runs}">0</span><span>Runs</span></div>
        <div class="card stat"><span class="stat-num" th:text="${player.wickets}">0</span><span>Wickets</span></div>
    </section>

    <p class="muted">Contact details are private and are not shown on public pages.</p>
    <div th:if="${canShare}" th:replace="~{fragments/share-row :: shareRow('player', ${player.id})}"></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
