<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container narrow">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1>Sign in</h1>
    <div class="flash flash-err" role="alert" th:if="${param.error}">Incorrect username or password.</div>
    <div class="flash flash-err" role="alert" th:if="${param.locked}">Too many failed attempts. Please wait 15 minutes and try again.</div>
    <div class="flash flash-ok" role="status" th:if="${param.logout}">You have been signed out.</div>

    <form class="card form" th:action="@{/login}" method="post">
        <label>Username <input type="text" name="username" autocomplete="username" maxlength="80" required autofocus></label>
        <label>Password <input type="password" name="password" autocomplete="current-password" maxlength="200" required></label>
        <button class="btn" type="submit">Sign in</button>
    </form>
    <p class="muted">New society? <a th:href="@{/subscribe}">Start a free trial</a>.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
