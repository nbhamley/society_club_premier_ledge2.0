<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Audit log')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="main" class="container wide">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1>Audit log</h1>
    <nav th:replace="~{fragments/admin-layout :: platformNav('audit')}"></nav>

    <form class="toolbar" method="get" th:action="@{/platform-admin/audit}">
        <label>Society
            <select name="societyId" data-autosubmit><option value="">All societies</option>
                <option th:each="s : ${societyOptions}" th:value="${s.id}" th:text="${s.name}" th:selected="${s.id == audit.societyId}">Society</option></select></label>
        <button class="btn btn-small btn-secondary" type="submit">Filter</button>
    </form>

    <div class="table-wrap"><table class="table">
        <thead><tr><th>When</th><th>Who</th><th>Society</th><th>Action</th><th>Item</th><th>Details</th></tr></thead>
        <tbody>
        <tr th:each="r : ${audit.rows}">
            <td th:text="${#temporals.format(r.timestamp, 'd MMM yyyy, HH:mm:ss')}">date</td>
            <td th:text="${r.user}">user</td>
            <td th:text="${r.societyName != null} ? ${r.societyName} : '-'">Society</td>
            <td><code th:text="${r.action}">ACTION</code></td>
            <td th:text="${r.entityType} + (${r.entityId} != null ? ' #' + ${r.entityId} : '')">TYPE #1</td>
            <td><small class="muted" th:text="${r.detail}">details</small></td>
        </tr>
        <tr th:if="${#lists.isEmpty(audit.rows)}"><td colspan="6" class="muted">Nothing recorded.</td></tr>
        </tbody></table></div>
    <p class="pager">
        <a th:if="${audit.page > 0}" th:href="@{/platform-admin/audit(page=${audit.page - 1},societyId=${audit.societyId})}">&larr; Newer</a>
        <span class="muted" th:text="'Page ' + ${audit.page + 1} + ' of ' + ${audit.pages}">Page 1 of 1</span>
        <a th:if="${audit.page + 1 < audit.pages}" th:href="@{/platform-admin/audit(page=${audit.page + 1},societyId=${audit.societyId})}">Older &rarr;</a></p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
