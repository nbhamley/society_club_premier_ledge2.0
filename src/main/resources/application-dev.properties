# Local developer experience: SQLite file, hot-reload templates, seed demo data.
spring.datasource.url=jdbc:sqlite:./data/scpl.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=10000
# sqlite-jdbc driver properties. Why: foreign keys are OFF by default in SQLite, WAL lets readers
# coexist with the scheduler's writes, and date_class=TEXT stores timestamps as ISO text, not epoch millis.
spring.datasource.hikari.data-source-properties.foreign_keys=true
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.date_class=TEXT
spring.datasource.hikari.data-source-properties.date_string_format=yyyy-MM-dd'T'HH:mm:ss.SSS
# Maps Hibernate's expected column types to what SQLite reports, so ddl-auto=validate passes.
spring.jpa.database-platform=com.scpl.config.SqliteDialect

spring.thymeleaf.cache=false
scpl.uploads.dir=./data/uploads
scpl.backup.dir=./data/backups
scpl.backup.society-dir=./data/society-backups
scpl.public-base-url=http://localhost:8080

feature.dev-log-credentials=true
scpl.seed.enabled=true

logging.level.com.scpl=DEBUG